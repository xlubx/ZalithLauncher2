name: COBBLEVERSE APK
# Rode em: Actions > "COBBLEVERSE APK" > Run workflow. O APK sai em "Artifacts".
# Baseado no build.yml oficial do Zalith (somente arm64, que cobre quase todos os celulares atuais).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: |
          version="4.1.2"
          curl -sL "https://github.com/bbqsrc/cargo-ndk/releases/download/v${version}/cargo-ndk-x86_64-unknown-linux-gnu-v${version}.tgz" |
            tar xz -C "$HOME/.cargo/bin" --strip-components=1
          chmod +x "$HOME/.cargo/bin"/cargo-ndk*

      - name: Setup Android NDK
        run: |
          ndk=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$ndk" ] || [ ! -f "$ndk/source.properties" ]; then
            sdkmanager --install "ndk;27.0.12077973"
            ndk=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Chave de assinatura propria (opcional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "Sem KEYSTORE_B64: usando a chave de debug do projeto (ok para uso entre amigos)."
          fi

      - name: Build APK (arm64)
        run: |
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleRelease -Darch=arm64

      - name: Enviar APK
        uses: actions/upload-artifact@v7
        with:
          name: COBBLEVERSE-apk
          path: ZalithLauncher/build/outputs/apk/release/*.apk
